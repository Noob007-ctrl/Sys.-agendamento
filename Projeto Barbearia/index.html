<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agendamento</title>
<style>
    @import url('https://fonts.googleapis.com/css2?family=Montserrat&display=swap');

    body{
    background-color: rgb(66, 44, 44);
    color: rgb(253, 229, 229);
    font-family: Montserrat;
    
    padding-top: 128px;

    }
    header{
        color: rgb(0, 0, 0);
        background-color: rgba(250, 235, 215, 0.884);
        text-align: center;

        padding: 20px;
        position: fixed;
        top: 0px;
        width: 100%;
    }

    div#suport-cards{
        display: flex;
    }

    .cards {
        color: black;
        background-color: antiquewhite;
        border: 3px solid rgba(78, 60, 60, 0.247);
        border-radius: 20px;
        box-shadow: 5px 5px rgba(0, 0, 0, 0.5);
        
        width: 250px; 
        height: 380px;

        margin: 20px;
        padding: 20px;

        text-align: center;

        transition: scale 0.2s linear;
    }

    .cards:hover{
        scale: 1.01;
    }

</style>
</head>
<body>
    <header>
        <h1> Faça seu Agendamento abaixo:</h1>
    </header>

    <div id="suport-cards">
        <h2>Barbeiros/horários disponíveis:</h2>

         <div class="cards">
            <h3>Lucas:</h3>
        </div>

        <div class="cards">
            <h3>Matue</h3>
        </div>
    </div>
   
 <script>

 </script>   
</body>

</html>
